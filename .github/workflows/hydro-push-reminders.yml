name: Hydro Push Reminders

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Firebase Admin dependencies
        working-directory: functions
        run: npm install --omit=dev
      - name: Send Hydro reminders
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node functions/send-reminders.js
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
